# =============================================================================
# Docker Compose - Test Configuration
# Usage: docker compose -f docker/docker-compose.test.yml up --abort-on-container-exit --exit-code-from prm-test
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PRM Service - Test Runner
  # ---------------------------------------------------------------------------
  prm-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    container_name: prm-test-runner
    environment:
      - DATABASE_URL=postgresql://prm_test:prm_test@postgres-test:5432/prm_test
      - REDIS_URL=redis://redis-test:6379/0
      - ENVIRONMENT=testing
      - TESTING=true
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - SECRET_KEY=test-secret-key
      # Mock Zoice for testing
      - ZOICE_BASE_URL=http://mock-zoice:8080
      - ZOICE_API_KEY=test-api-key
      - ZOICE_WEBHOOK_SECRET=test-webhook-secret
      # Disable external services in tests
      - TWILIO_ACCOUNT_SID=
      - OPENAI_API_KEY=
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      - test_results:/app/test-results
      - test_coverage:/app/coverage
    networks:
      - prm-test-network

  # ---------------------------------------------------------------------------
  # PostgreSQL - Isolated Test Database
  # ---------------------------------------------------------------------------
  postgres-test:
    image: postgres:15-alpine
    container_name: prm-postgres-test
    environment:
      POSTGRES_DB: prm_test
      POSTGRES_USER: prm_test
      POSTGRES_PASSWORD: prm_test
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests
    networks:
      - prm-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prm_test -d prm_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis - Isolated Test Instance
  # ---------------------------------------------------------------------------
  redis-test:
    image: redis:7-alpine
    container_name: prm-redis-test
    networks:
      - prm-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # ---------------------------------------------------------------------------
  # Mock Zoice Server - For testing voice webhooks
  # ---------------------------------------------------------------------------
  mock-zoice:
    image: mockserver/mockserver:latest
    container_name: prm-mock-zoice
    ports:
      - "1080:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/zoice-expectations.json
    volumes:
      - ./mock-servers/zoice-expectations.json:/config/zoice-expectations.json:ro
    networks:
      - prm-test-network
    profiles:
      - mocks

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  prm-test-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  test_results:
    driver: local
  test_coverage:
    driver: local
