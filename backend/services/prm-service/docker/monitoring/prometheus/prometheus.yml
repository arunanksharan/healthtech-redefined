# =============================================================================
# Prometheus Configuration for PRM Service
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'prm-service'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PRM Service metrics
  - job_name: 'prm-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['prm-service:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'prm-service'
