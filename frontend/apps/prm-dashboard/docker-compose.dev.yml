# PRM Dashboard - Development Docker Compose
# Uses hot-reload and mounts source code as volume

version: '3.8'

services:
  # ==========================================================================
  # PRM Dashboard (Development Mode)
  # ==========================================================================
  prm-dashboard-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: prm-dashboard-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://host.docker.internal:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://host.docker.internal:8000/ws/connect}
      - NEXT_PUBLIC_CONVERSATION_API_URL=${NEXT_PUBLIC_CONVERSATION_API_URL:-http://host.docker.internal:3001}
      - NEXT_PUBLIC_CONVERSATION_WS_URL=${NEXT_PUBLIC_CONVERSATION_WS_URL:-ws://host.docker.internal:3001}
      - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL:-}
      - NEXT_PUBLIC_ORG_ID=${NEXT_PUBLIC_ORG_ID:-default}
      - NEXT_PUBLIC_TENANT_ID=${NEXT_PUBLIC_TENANT_ID:-default}
      - NEXT_PUBLIC_ENABLE_VOICE=${NEXT_PUBLIC_ENABLE_VOICE:-true}
      - NEXT_PUBLIC_ENABLE_AI_ASSISTANT=${NEXT_PUBLIC_ENABLE_AI_ASSISTANT:-true}
      - NEXT_PUBLIC_ZOICE_API_URL=${NEXT_PUBLIC_ZOICE_API_URL:-https://api2.zoice.ai}
    volumes:
      # Mount source code for hot-reload
      - .:/app
      # Don't mount node_modules from host
      - /app/node_modules
      - /app/.next
    networks:
      - prm-network
    restart: unless-stopped
    # Allow connecting to host services
    extra_hosts:
      - "host.docker.internal:host-gateway"

# =============================================================================
# Networks
# =============================================================================
networks:
  prm-network:
    driver: bridge
