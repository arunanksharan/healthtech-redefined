# PRM Dashboard - Standalone Docker Compose
# Use this to run just the frontend service
# For full stack, use docker-compose.full.yml

version: '3.8'

services:
  # ==========================================================================
  # PRM Dashboard (Next.js Frontend)
  # ==========================================================================
  prm-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://prm-service:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://prm-service:8000/ws/connect}
        NEXT_PUBLIC_CONVERSATION_API_URL: ${NEXT_PUBLIC_CONVERSATION_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_CONVERSATION_WS_URL: ${NEXT_PUBLIC_CONVERSATION_WS_URL:-ws://localhost:3001}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
        NEXT_PUBLIC_ORG_ID: ${NEXT_PUBLIC_ORG_ID:-default}
        NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID:-default}
        NEXT_PUBLIC_ENABLE_VOICE: ${NEXT_PUBLIC_ENABLE_VOICE:-true}
        NEXT_PUBLIC_ENABLE_AI_ASSISTANT: ${NEXT_PUBLIC_ENABLE_AI_ASSISTANT:-true}
        NEXT_PUBLIC_ENABLE_AI: ${NEXT_PUBLIC_ENABLE_AI:-true}
        NEXT_PUBLIC_ENABLE_WHATSAPP: ${NEXT_PUBLIC_ENABLE_WHATSAPP:-true}
        NEXT_PUBLIC_ENABLE_SMS: ${NEXT_PUBLIC_ENABLE_SMS:-true}
        NEXT_PUBLIC_ZOICE_API_URL: ${NEXT_PUBLIC_ZOICE_API_URL:-https://api2.zoice.ai}
    container_name: prm-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://prm-service:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://prm-service:8000/ws/connect}
      - NEXT_PUBLIC_LIVEKIT_URL=${NEXT_PUBLIC_LIVEKIT_URL:-}
      - NEXT_PUBLIC_ZOICE_API_URL=${NEXT_PUBLIC_ZOICE_API_URL:-https://api2.zoice.ai}
    networks:
      - prm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # Redis (for session caching if needed)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: prm-dashboard-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - prm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --appendonly yes
    profiles:
      - with-redis

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  prm-network:
    driver: bridge
    # Connect to external prm-network if backend is already running
    # external: true
